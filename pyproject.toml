[project]
name = "hybrid-rag-eval"
version = "0.1.0"
description = "Hybrid retrieval (BM25 + dense + RRF + cross-encoder rerank) with grounded, cited answers and a BEIR evaluation harness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyStemmer>=2.2"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
llm = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
